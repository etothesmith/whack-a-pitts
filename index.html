<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Whack-a-Pitts: The Revenge of Dr. Caliari</title>
<meta name="theme-color" content="#17112b">
<meta name="mobile-web-app-capable" content="yes">

<style>
  html, body { margin: 0; height: 100%; background: #17112b; overflow: hidden; overscroll-behavior: none; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  #game {
    position: fixed; display: block; outline: none; cursor: none; object-fit: contain;
    top: env(safe-area-inset-top, 0px); left: env(safe-area-inset-left, 0px);
    width: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
    height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  }
  @supports (height: 100dvh) { #game { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); } }
  #rotate {
    position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center; background: #17112b; color: #ffcf33;
    font: 900 26px 'Nunito', 'Trebuchet MS', Arial, sans-serif;
  }
  #rotate small { color: #cfe3ff; font-size: 16px; font-weight: 800; }
  #rotate .ph { font-size: 84px; animation: rot 1.8s ease-in-out infinite; }
  @keyframes rot { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
</style>
</head>
<body>
<div id="rotate"><div class="ph">📱</div><div>Turn your phone sideways to play!</div><small>Whack-a-Pitts plays in landscape. Your game is paused.</small></div>
<canvas id="game" tabindex="0" aria-label="Whack-a-Pitts game"></canvas>
<script>
"use strict";
/* =====================================================================
   WHACK-A-PITTS: THE REVENGE OF DR. CALIARI
   A 6-level gag game. Single file, no dependencies.
   ---------------------------------------------------------------------
   CUSTOM SPRITES: paste image paths (e.g. "sprites/caliari_idle.png"),
   full URLs, or base64 data URIs ("data:image/png;base64,....") below,
   then set use_custom_sprites to true. Any sprite left as null (or that
   fails to load) falls back to the built-in cartoon drawings.
   Transparent PNGs, character standing/feet at the bottom, work best.
   ===================================================================== */
const ASSETS = {
  // Dr. Caliari Sprites
  caliari_idle: "assets/caliari_idle.png",      // Image URL or Base64 (transparent PNG)
  caliari_whack: "assets/caliari_whack.png",    // Whack / Action pose
  caliari_run: "assets/caliari_run.png",        // Running animation / sprite
  caliari_hurt: "assets/caliari_hurt.png",      // Bonked / Tripped pose
  caliari_hero: "assets/caliari_hero.png",      // Victory pose with coffee (results + epilogue)
  caliari_bat: "assets/caliari_bat.png",        // Swinging the rolled work order (title screen)

  // Coach Pitts Sprites
  pitts_peek: "assets/pitts_peek.png",          // Grinning, waving
  pitts_popup: "assets/pitts_popup.png",        // Pop-up bust (Level 1 lockers)
  pitts_whistle: "assets/pitts_whistle.png",    // Blowing whistle face
  pitts_throw: "assets/pitts_throw.png",        // Holding a dodgeball (running / throwing)
  pitts_cart: "assets/pitts_cart.png",          // Driving golf cart sprite
  pitts_defeated: "assets/pitts_defeated.png",  // Grumpy with mop sprite

  // Audio & Icon FX
  clipboard_icon: "assets/clipboard_icon.png",
  coffee_cup: "assets/coffee_cup.png",
  dodgeball: "assets/dodgeball.png",

  // Stage backgrounds (1440x810 JPGs). Wrestling (2) has no art yet; the
  // hallway-maze art doesn't match Level 6's maze layout, so those stay drawn.
  bg_level1: "assets/bg_level1.jpg", bg_level2: null, bg_level3: "assets/bg_level3.jpg",
  bg_level4: "assets/bg_level4.jpg", bg_level5: "assets/bg_level5.jpg", bg_level6: null, bg_level7: "assets/bg_level7.jpg",

  // Set to true once custom images are provided in the dictionary
  use_custom_sprites: true
};

/* ---------- image loader with automatic fallback ---------- */
const IMG = {};
(function loadAssets() {
  if (!ASSETS.use_custom_sprites) return;
  for (const k in ASSETS) {
    const v = ASSETS[k];
    if (typeof v !== "string" || !v) continue;
    const im = new Image();
    im.onload = () => { IMG[k] = im; };
    im.onerror = () => { console.warn("Sprite failed, using fallback:", k); };
    im.src = v;
  }
})();
const spriteReady = k => ASSETS.use_custom_sprites && !!IMG[k];

/* ---------- canvas ---------- */
const W = 960, H = 540;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = W * DPR; canvas.height = H * DPR;
}
resize();
window.addEventListener("resize", resize);

/* ---------- utils ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const TAU = Math.PI * 2;
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
function weighted(list) { // [[item, weight],...]
  let tot = 0; for (const [, w] of list) tot += w;
  let r = Math.random() * tot;
  for (const [it, w] of list) { if ((r -= w) <= 0) return it; }
  return list[list.length - 1][0];
}

/* ---------- drawing primitives ---------- */
const INK = "#1d1830";
function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function rr(x, y, w, h, r, fill, stroke, lw = 3) {
  rrPath(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function circ(x, y, r, fill, stroke, lw = 3) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, TAU);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function ell(x, y, rx, ry, fill, stroke, lw = 3) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, TAU);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function line(x1, y1, x2, y2, color, lw = 3) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.stroke();
}
function poly(pts, fill, stroke, lw = 3) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.lineJoin = "round"; ctx.stroke(); }
}
const FONT_D = "'Bangers', Impact, 'Arial Black', sans-serif";
const FONT_B = "'Nunito', 'Trebuchet MS', Arial, sans-serif";
function txt(s, x, y, size, color = "#fff", align = "center", opts = {}) {
  ctx.font = `${opts.weight || ""} ${size}px ${opts.font || FONT_D}`.trim();
  ctx.textAlign = align; ctx.textBaseline = opts.base || "middle";
  if (opts.stroke) { ctx.lineJoin = "round"; ctx.strokeStyle = opts.stroke; ctx.lineWidth = opts.sw || Math.max(3, size / 7); ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function wrap(s, maxW, size, font = FONT_B, weight = "800") {
  ctx.font = `${weight} ${size}px ${font}`;
  const words = s.split(" "); const lines = []; let cur = "";
  for (const w of words) {
    const t = cur ? cur + " " + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function drawSprite(key, x, y, h, flip = false) { // bottom-center anchored
  const im = IMG[key]; const w = h * im.width / im.height;
  ctx.save(); ctx.translate(x, y); if (flip) ctx.scale(-1, 1);
  ctx.drawImage(im, -w / 2, -h, w, h); ctx.restore();
}
function shadow(x, y, rx, a = 0.25) { ell(x, y, rx, rx * 0.3, `rgba(0,0,0,${a})`); }

/* ---------- audio: everything synthesized ---------- */
const SFX = {
  ac: null, master: null, nbuf: null, muted: false, vol: 0.55,
  init() {
    if (this.ac) { if (this.ac.state === "suspended") this.ac.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = this.muted ? 0 : this.vol;
      this.master.connect(this.ac.destination);
      const len = this.ac.sampleRate * 1.0;
      this.nbuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = this.nbuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ac = null; }
  },
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : this.vol; },
  tone(f, d, o = {}) {
    if (!this.ac || this.muted) return;
    const { type = "square", vol = 0.25, slide = 0, delay = 0, attack = 0.005, vib = null } = o;
    const t = this.ac.currentTime + delay;
    const osc = this.ac.createOscillator(), g = this.ac.createGain();
    osc.type = type; osc.frequency.setValueAtTime(f, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    if (vib) {
      const l = this.ac.createOscillator(), lg = this.ac.createGain();
      l.frequency.value = vib[0]; lg.gain.value = vib[1];
      l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + d + 0.05);
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g); g.connect(this.master); osc.start(t); osc.stop(t + d + 0.05);
  },
  noise(d, o = {}) {
    if (!this.ac || this.muted) return;
    const { vol = 0.3, freq = 1000, type = "lowpass", delay = 0, q = 1, sweep = 0 } = o;
    const t = this.ac.currentTime + delay;
    const s = this.ac.createBufferSource(); s.buffer = this.nbuf;
    const f = this.ac.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (sweep) f.frequency.exponentialRampToValueAtTime(Math.max(40, freq + sweep), t + d);
    const g = this.ac.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + d + 0.05);
  },
  play(n) {
    if (!this.ac || this.muted) return;
    switch (n) {
      case "whistle":
        this.tone(2750, 0.18, { vol: 0.09, vib: [38, 220] });
        this.tone(2750, 0.42, { vol: 0.09, vib: [38, 220], delay: 0.22 }); break;
      case "chirp": this.tone(2900, 0.12, { vol: 0.08, vib: [40, 260] }); break;
      case "bonk":
        this.tone(260, 0.16, { type: "sine", vol: 0.55, slide: -170 });
        this.tone(780, 0.05, { type: "triangle", vol: 0.25 });
        this.noise(0.05, { freq: 2400, vol: 0.25, type: "bandpass" }); break;
      case "splat":
        this.noise(0.25, { freq: 700, vol: 0.45, sweep: -500 });
        this.tone(140, 0.2, { type: "sine", vol: 0.4, slide: -80 }); break;
      case "stamp":
        this.noise(0.14, { freq: 320, vol: 0.8 });
        this.tone(90, 0.16, { type: "sine", vol: 0.6, slide: -45 }); break;
      case "rumble": this.noise(0.7, { freq: 160, vol: 0.35 }); break;
      case "buzzer":
        this.tone(110, 0.45, { type: "sawtooth", vol: 0.16 });
        this.tone(117, 0.45, { type: "sawtooth", vol: 0.16 }); break;
      case "gulp":
        for (let i = 0; i < 3; i++) this.tone(260, 0.09, { type: "sine", vol: 0.35, slide: 320, delay: i * 0.13 }); break;
      case "fanfare":
        [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.16, { type: "square", vol: 0.12, delay: i * 0.12 }));
        [523, 659, 784, 1047].forEach(f => this.tone(f, 0.7, { type: "triangle", vol: 0.12, delay: 0.5 })); break;
      case "pickup":
        this.tone(880, 0.07, { vol: 0.12 }); this.tone(1320, 0.1, { vol: 0.12, delay: 0.07 }); break;
      case "coin": this.tone(988, 0.06, { vol: 0.12 }); this.tone(1319, 0.16, { vol: 0.12, delay: 0.06 }); break;
      case "click": this.tone(620, 0.04, { vol: 0.1 }); break;
      case "spill":
        this.noise(0.35, { freq: 900, type: "bandpass", vol: 0.4, q: 2 });
        this.tone(420, 0.35, { type: "sine", vol: 0.3, slide: -320 }); break;
      case "whoosh": this.noise(0.14, { freq: 1600, type: "bandpass", vol: 0.18, sweep: 1500 }); break;
      case "beep": this.tone(660, 0.12, { vol: 0.14 }); break;
      case "go": this.tone(990, 0.3, { vol: 0.16 }); this.tone(1485, 0.3, { vol: 0.08 }); break;
      case "splash": this.noise(0.6, { freq: 2600, type: "highpass", vol: 0.35 }); this.noise(0.4, { freq: 500, vol: 0.25 }); break;
      case "zap": this.tone(1400, 0.35, { type: "sawtooth", vol: 0.15, slide: -1250 }); this.noise(0.3, { freq: 3000, type: "highpass", vol: 0.2 }); break;
      case "throw": this.noise(0.1, { freq: 2200, type: "bandpass", vol: 0.15 }); this.tone(500, 0.08, { type: "triangle", vol: 0.12, slide: 300 }); break;
      case "boing": this.tone(180, 0.3, { type: "sine", vol: 0.35, slide: 420 }); break;
      case "wrong": this.tone(300, 0.12, { type: "square", vol: 0.12 }); this.tone(200, 0.22, { type: "square", vol: 0.12, delay: 0.1 }); break;
      case "boom": this.noise(0.8, { freq: 400, vol: 0.6, sweep: -300 }); this.tone(70, 0.6, { type: "sine", vol: 0.5, slide: -30 }); break;
      case "cheer": this.noise(0.9, { freq: 1400, type: "bandpass", vol: 0.28, q: 0.6 }); this.noise(0.6, { freq: 2600, type: "bandpass", vol: 0.15, q: 1, delay: 0.1 }); break;
      case "honk": this.tone(330, 0.15, { type: "square", vol: 0.12 }); this.tone(415, 0.25, { type: "square", vol: 0.12, delay: 0.16 }); break;
    }
  }
};

/* ---------- save data ---------- */
const SAVE_KEY = "whackapitts_save_v1";
const NUM_LEVELS = 7, LAST_LEVEL = NUM_LEVELS - 1;
const save = { unlocked: 1, stars: Array(NUM_LEVELS).fill(0), hi: Array(NUM_LEVELS).fill(0), muted: false, beaten: false };
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
  if (s) {
    if (Array.isArray(s.stars) && s.stars.length === 6) { // migrate 6-level save: wrestling inserted as level 2
      s.stars.splice(1, 0, 0); s.hi.splice(1, 0, 0); if (s.unlocked >= 2) s.unlocked++;
    }
    Object.assign(save, s);
    while (save.stars.length < NUM_LEVELS) save.stars.push(0);
    while (save.hi.length < NUM_LEVELS) save.hi.push(0);
  }
} catch (e) { }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { } }
SFX.muted = !!save.muted;

/* ---------- input ---------- */
const input = { keys: {}, pressed: {}, clicks: [], mx: W / 2, my: H / 2, down: false, lastPointer: "mouse" };
const normKey = e => (e.key.length === 1 ? e.key.toLowerCase() : e.key);
let cheatBuf = "";
window.addEventListener("keydown", e => {
  SFX.init();
  const k = normKey(e);
  if (!input.keys[k]) input.pressed[k] = true;
  input.keys[k] = true;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault();
  if (/^[a-z]$/i.test(e.key)) {
    cheatBuf = (cheatBuf + e.key.toUpperCase()).slice(-9);
    if (cheatBuf === "WORKORDER") { cheatBuf = ""; toggleInfinite(); }
  }
});
window.addEventListener("keyup", e => { input.keys[normKey(e)] = false; });
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  const s = Math.min(r.width / W, r.height / H);
  const ox = r.left + (r.width - W * s) / 2, oy = r.top + (r.height - H * s) / 2;
  return { x: (e.clientX - ox) / s, y: (e.clientY - oy) / s };
}
/* ---------- touch: floating thumb joystick (left half of the screen) ---------- */
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0, ax: 0, ay: 0, R: 58 };
function joystickWanted() { return typeof G !== "undefined" && G.state === "GAMEPLAY" && !G.paused && G.countdown <= 0 && G.level && G.level.usesJoystick; }
function hitsButton(p) { return typeof hotButtons !== "undefined" && hotButtons.some(b => inRect(p.x, p.y, { x: b.x - 10, y: b.y - 10, w: b.w + 20, h: b.h + 20 })); }
canvas.addEventListener("pointerdown", e => {
  SFX.init(); canvas.focus();
  const p = toLogical(e), touch = e.pointerType && e.pointerType !== "mouse";
  input.lastPointer = e.pointerType || "mouse";
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { }
  e.preventDefault();
  if (touch && joystickWanted()) {
    if (joy.id === null && p.x < W * 0.5 && p.y > 50 && !hitsButton(p)) {
      Object.assign(joy, { id: e.pointerId, ox: p.x, oy: p.y, x: p.x, y: p.y, ax: 0, ay: 0 });
      return;
    }
    input.mx = p.x; input.my = p.y; input.clicks.push({ ...p, touch }); // taps only, no hold-to-move
    return;
  }
  input.mx = p.x; input.my = p.y; input.down = true;
  input.clicks.push({ ...p, touch });
});
canvas.addEventListener("pointermove", e => {
  const p = toLogical(e);
  if (e.pointerId === joy.id) {
    let dx = p.x - joy.ox, dy = p.y - joy.oy; const d = Math.hypot(dx, dy);
    if (d > joy.R) { dx *= joy.R / d; dy *= joy.R / d; }
    joy.x = joy.ox + dx; joy.y = joy.oy + dy;
    const k = d < 9 ? 0 : 1; joy.ax = k * dx / joy.R; joy.ay = k * dy / joy.R;
    return;
  }
  input.mx = p.x; input.my = p.y; if (e.pointerType) input.lastPointer = e.pointerType;
});
function pointerEnd(e) { if (e.pointerId === joy.id) { joy.id = null; joy.ax = joy.ay = 0; } else input.down = false; }
window.addEventListener("pointerup", pointerEnd);
window.addEventListener("pointercancel", pointerEnd);
window.addEventListener("touchend", () => SFX.init(), { passive: true });
canvas.addEventListener("contextmenu", e => e.preventDefault());
const kp = (...ks) => ks.some(k => input.pressed[k]);
const kd = (...ks) => ks.some(k => input.keys[k]);
function moveAxes() {
  let x = 0, y = 0;
  if (kd("ArrowLeft", "a")) x -= 1; if (kd("ArrowRight", "d")) x += 1;
  if (kd("ArrowUp", "w")) y -= 1; if (kd("ArrowDown", "s")) y += 1;
  if (!x && !y && joy.id !== null) { x = joy.ax; y = joy.ay; }
  return { x, y };
}
function drawJoystick() {
  if (joy.id !== null) {
    ctx.globalAlpha = 0.35; circ(joy.ox, joy.oy, joy.R + 10, "#fff", INK, 3);
    ctx.globalAlpha = 0.85; circ(joy.x, joy.y, 26, "#ffcf33", INK, 3); ctx.globalAlpha = 1;
  } else {
    ctx.globalAlpha = 0.28; circ(110, 440, joy.R + 10, "#fff", INK, 3); circ(110, 440, 26, "#ffcf33", INK, 3); ctx.globalAlpha = 1;
    txt("DRAG TO MOVE", 110, 520, 14, "rgba(255,255,255,0.7)", "center", { stroke: INK, sw: 3 });
  }
}

/* ---------- full screen + orientation ---------- */
function fsAvailable() { return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); }
function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function toggleFullscreen() {
  try {

/* ---------- effects: particles, bubbles, floaters, shake, toast ---------- */
const FX = { parts: [], bubbles: [], floats: [], shake: 0, toast: null };
function burst(x, y, n, colors, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(o.min || 60, o.max || 260);
    FX.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0), life: rand(0.4, o.life || 0.9), t: 0,
      c: pick(colors), s: rand(o.smin || 3, o.smax || 7), g: o.g ?? 500, shape: o.shape || "dot", rot: rand(0, TAU), vr: rand(-8, 8) });
  }
}
function bubble(x, y, text, who = "pitts", dur = 1.8) {
  FX.bubbles = FX.bubbles.filter(b => dist(b.x, b.y, x, y) > 60);
  FX.bubbles.push({ x, y, text, who, t: 0, dur });
}
function floater(x, y, text, color = "#ffe14d", size = 28) { FX.floats.push({ x, y, text, color, size, t: 0 }); }
function shake(a) { FX.shake = Math.max(FX.shake, a); }
function toast(text, dur = 2.2, color = "#ffe14d") { FX.toast = { text, t: 0, dur, color }; }
function updateFX(dt) {
  for (const p of FX.parts) { p.t += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; }
  FX.parts = FX.parts.filter(p => p.t < p.life);
  for (const b of FX.bubbles) b.t += dt; FX.bubbles = FX.bubbles.filter(b => b.t < b.dur);
  for (const f of FX.floats) { f.t += dt; f.y -= 50 * dt; } FX.floats = FX.floats.filter(f => f.t < 1);
  FX.shake = Math.max(0, FX.shake - dt * 30);
  if (FX.toast) { FX.toast.t += dt; if (FX.toast.t > FX.toast.dur) FX.toast = null; }
}
function clearFX() { FX.parts = []; FX.bubbles = []; FX.floats = []; FX.shake = 0; }
function drawFX() {
  for (const p of FX.parts) {
    ctx.globalAlpha = clamp(1 - p.t / p.life, 0, 1);

    } else circ(p.x, p.y, p.s, p.c);

}
function drawBubble(b) {

  const lines = wrap(b.text, 210, 17);
  ctx.font = `800 17px ${FONT_B}`;

      this.bx += dx / d * Math.min(d, 320 * dt); this.by += dy / d * Math.min(d, 320 * dt); this.bflip = dx < 0;

    const speed = 0.5 + (1 - this.hp / 12) * 0.3;
    const oldx = this.bx;
    this.ang += speed * dt;
    this.bx = TCX + Math.cos(this.ang) * TRX; this.by = TCY + Math.sin(this.ang) * TRY;
    this.bflip = this.bx < oldx;

    const ox = this.bx + (this.bflip ? -40 : 40) * 0.7, oy = this.by - 38;

      this.balls.push({ x: ox, y: oy, vx: Math.cos(a) * 270, vy: Math.sin(a) * 270, r: 12, kind: "dodge", t: 0 });
      this.balls.push({ x: ox, y: oy + 12, vx: Math.cos(a + 0.12) * 270, vy: Math.sin(a + 0.12) * 270, r: 12, kind: "dodge", t: 0 });

    }
    if (this.fire2 <= 0) {

      for (let i = -2; i <= 2; i++) this.balls.push({ x: ox, y: oy, vx: Math.cos(a + i * 0.24) * 220, vy: Math.sin(a + i * 0.24) * 220, r: 7, kind: "tennis", t: 0 });
      SFX.play("whoosh");

  }
  updateP2(dt) {
    this.bx = TCX + Math.sin(this.t * 0.8) * 60; this.by = TCY - 10;
    this.whistleT -= dt;
    if (this.whistleT <= 0 && this.blowT <= 0) { this.blowT = 0.55; SFX.play("chirp"); }
    if (this.blowT > 0) {
      this.blowT -= dt;

    }
    for (const r of this.rings) {
      r.r += 230 * dt;
      const d = dist(r.x, r.y, this.px, this.py - 10);
      if (!r.hit && Math.abs(d - r.r) < 14 && this.jh() < 14) { r.hit = true; this.damage("Blown away by the MEGA-WHISTLE. Ears still ringing."); }
    }
    this.rings = this.rings.filter(r => r.r < 1100);
    this.coneT -= dt;
    if (this.coneT <= 0) {
      this.coneT = lerp(1.1, 0.6, 1 - this.hp / 12);
      this.cones.push({ x: clamp(this.px + rand(-70, 70), 60, W - 60), y: clamp(this.py + rand(-50, 50), 100, H - 30), t: 0, fall: 0.9, landed: false });
    }
    for (const c of this.cones) {
      c.t += dt;
      if (!c.landed && c.t >= c.fall) { c.landed = true; SFX.play("bonk"); if (dist(c.x, c.y, this.px, this.py) < 30) this.damage("Bonked by a falling cone. Safety first, Coach!"); }
    }
    this.cones = this.cones.filter(c => c.t < c.fall + 1.5);
  }
  updateP3(dt) {
    for (const v of this.valves) {
      v.cd -= dt; v.flood = Math.max(0, v.flood - dt);
      if (v.cd <= 0 && dist(v.x, v.y, this.px, this.py) < 30) { v.cd = 7; v.flood = 5; SFX.play("splash"); floater(v.x, v.y - 50, "SPRINKLERS ON!", "#6bc6ff", 22); }
    }
    if (this.bstate === "stunned") {
      this.stun -= dt;
      if (Math.random() < 0.3) burst(this.bx, this.by - 40, 2, ["#6bc6ff", "#ffe14d"], { g: 100, max: 120 });
      if (this.stun <= 0) { this.bstate = "recover"; this.pt = 0.8; }
      return;
    }
    if (this.bstate === "recover") { this.pt -= dt; if (this.pt <= 0) { this.bstate = "aim"; this.pt = 1.1; SFX.play("honk"); } return; }
    if (this.bstate === "aim") {
      this.pt -= dt;

      this.bflip = Math.cos(this.charge.a) < 0;
      if (this.pt <= 0) { this.bstate = "charge"; SFX.play("rumble"); }
      return;
    }
    if (this.bstate === "charge") {
      const sp = 640, a = this.charge.a;
      this.bx += Math.cos(a) * sp * dt; this.by += Math.sin(a) * sp * dt;
      for (const v of this.valves) {
        if (v.flood > 0 && dist(this.bx, this.by, v.x, v.y) < 100) {
          v.flood = 0; this.bstate = "stunned"; this.stun = 2.6; this.shorts++; this.score += 600;
          SFX.play("zap"); SFX.play("splash"); shake(16);
          burst(this.bx, this.by - 40, 30, ["#6bc6ff", "#fff", "#ffe14d"], { shape: "star" });
          floater(this.bx, this.by - 110, `SHORT CIRCUIT! ${this.shorts}/3`, "#6bc6ff", 30);
          bubble(this.bx, this.by - 120, pick(["MY CART! It's soaked!", "Who turned on the sprinklers?!", "Is this... a work order?"]), "pitts", 2);
          if (this.shorts >= 3) { this.score += (G.infinite ? 3 : G.coffee) * 500 + (this.tookDamage ? 0 : 2000); winLevel(); }
          return;
        }
      }
      if (dist(this.bx, this.by - 20, this.px, this.py - 20) < 52) this.damage("Run over by a golf cart on Field Day. Classic Pitts.");
      if (this.bx < ARENA.x + 40 || this.bx > ARENA.x + ARENA.w - 40 || this.by < ARENA.y + 50 || this.by > ARENA.y + ARENA.h - 10) {
        this.bx = clamp(this.bx, ARENA.x + 40, ARENA.x + ARENA.w - 40); this.by = clamp(this.by, ARENA.y + 50, ARENA.y + ARENA.h - 10);
        this.bstate = "recover"; this.pt = 0.9; SFX.play("bonk"); shake(6);
      }
    }
  }
  drawField() {
    if (spriteReady("bg_level7")) { ctx.drawImage(IMG.bg_level7, 0, 0, W, H); return; }
    ctx.fillStyle = "#2b2140"; ctx.fillRect(0, 0, W, H);
    // stands
    for (let i = 0; i < 40; i++) { circ(i * 25 + 10, 54, 7, pick(["#d63a2f", "#1f3d7a", "#ffe14d", "#fff"])); }
    ctx.fillStyle = "#3e9b4f"; ctx.fillRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);
    for (let i = 0; i < 12; i++) { ctx.fillStyle = i % 2 ? "rgba(255,255,255,0.05)" : "rgba(0,0,0,0.05)"; ctx.fillRect(ARENA.x + i * 75, ARENA.y, 75, ARENA.h); }
    // track
    ctx.beginPath(); ctx.ellipse(TCX, TCY, TRX, TRY, 0, 0, TAU); ctx.strokeStyle = "#b5523b"; ctx.lineWidth = 64; ctx.stroke();
    for (const k of [-24, -8, 8, 24]) { ctx.beginPath(); ctx.ellipse(TCX, TCY, TRX + k, TRY + k, 0, 0, TAU); ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 2; ctx.stroke(); }
    // field lines
    for (let i = 0; i <= 10; i++) { const x = 230 + i * 50; line(x, TCY - 120, x, TCY + 120, "rgba(255,255,255,0.6)", 2); }
    txt("50", TCX, TCY + 80, 30, "rgba(255,255,255,0.55)");
    txt("FIELD DAY CHAMPIONSHIP", TCX, TCY - 92, 22, "rgba(255,255,255,0.5)");
  }
  draw() {
    this.drawField();
    // floods + valves
    if (this.phase === 3) for (const v of this.valves) {
      if (v.flood > 0) { ctx.globalAlpha = 0.45 + 0.1 * Math.sin(this.t * 8); ell(v.x, v.y, 100, 60, "#6bc6ff"); ctx.globalAlpha = 1;
        for (let i = 0; i < 6; i++) { const a = this.t * 3 + i; line(v.x, v.y - 8, v.x + Math.cos(a) * 40, v.y - 30 + Math.sin(a * 2) * 8, "rgba(220,240,255,0.8)", 3); } }
      ctx.globalAlpha = v.cd > 0 && v.flood <= 0 ? 0.5 : 1;
      circ(v.x, v.y, 16, "#c9d2dc", INK, 3); circ(v.x, v.y, 7, v.cd > 0 ? "#888" : "#1f9eff", INK, 2);
      if (v.cd <= 0) txt("VALVE", v.x, v.y + 28, 14, "#fff", "center", { stroke: INK, sw: 3 });

    for (const r of this.rings) {
      ctx.globalAlpha = clamp(1 - r.r / 1000, 0.2, 0.9);
      ctx.beginPath(); ctx.ellipse(r.x, r.y + 40, r.r, r.r * 0.62, 0, 0, TAU); ctx.strokeStyle = "#fff"; ctx.lineWidth = 14; ctx.stroke();
      ctx.strokeStyle = "#ffcf33"; ctx.lineWidth = 5; ctx.stroke(); ctx.globalAlpha = 1;
    }
    for (const c of this.cones) {
      if (!c.landed) { const k = c.t / c.fall; ell(c.x, c.y, 24 * k + 6, (24 * k + 6) * 0.35, "rgba(0,0,0,0.35)"); drawCone(c.x, c.y - (1 - k) * 420, 0.9); }

    }
    for (const m of this.mugs) { shadow(m.x, m.y + 8, 12); drawCoffee(m.x, m.y - 10 + Math.sin(m.t * 5) * 3, 1.3, true, m.t); }
    const list = [];
    list.push({ y: this.by, d: () => this.drawBoss() });
    list.push({ y: this.py, d: () => {
      const jh = this.jh(); shadow(this.px, this.py, 16 * (1 - jh / 90));
      ctx.save(); if (G.invuln > 0 && Math.floor(G.t * 16) % 2) ctx.globalAlpha = 0.4;
      drawCaliari(this.px, this.py - jh, 0.55, G.invuln > 0.9 ? "hurt" : this.moving ? "run" : "whack", this.t, { flip: this.face < 0 });
      ctx.restore();
    } });
    list.sort((a, b) => a.y - b.y).forEach(o => o.d());
    for (const s of this.shots) { ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.t * 18); rr(-s.r, -s.r * 0.45, s.r * 2, s.r * 0.9, 3, "#fffaf0", INK, 2.5); line(-s.r * 0.6, 0, s.r * 0.6, 0, "#d33", 2); ctx.restore(); }

  }
  drawBoss() {
    ctx.save();

}
function drawStars(x, y, n, size = 22, anim = 99) {
  for (let i = 0; i < 3; i++) {

    ctx.save(); ctx.translate(x + (i - 1) * size * 2.2, y); ctx.scale(k, k);

    txt(left ? "DR. CALIARI" : "COACH PITTS", px, 402, 22, "#fff");
    // text box
    const bx = left ? 280 : 60, bw = 620;
    panel(bx, 220, bw, 170);
    const shown = text.slice(0, Math.floor(cut.chars));
    wrap(shown, bw - 50, 26, FONT_B, "900").forEach((l, k) => txt(l, bx + 26, 262 + k * 34, 26, INK, "left", { font: FONT_B, weight: "900" }));
    if (cut.chars >= text.length && Math.floor(G.t * 2) % 2) txt("▼", bx + bw - 30, 368, 22, INK);
  } else {
    panel(130, 170, 700, 270);
    txt("🎯 GOAL", 160, 208, 30, "#d63a2f", "left");
    txt(M.goal, 160, 244, 22, INK, "left", { font: FONT_B, weight: "900" });
    txt("🎮 CONTROLS", 160, 290, 26, "#2b6cd4", "left");
    let yy = 322;
    for (const c of M.controls) { for (const l of wrap(c, 630, 17)) { txt(l, 170, yy, 17, INK, "left", { font: FONT_B, weight: "800" }); yy += 22; } yy += 4; }
    button(W / 2 - 110, 454, 220, 60, "LET'S GO! ▶", beginPlay, { size: 30, color: "#7dffb0" });
  }
  button(W - 140, 480, 120, 40, "SKIP ▶▶", beginPlay, { size: 18, color: "#cfe3ff" });
  txt("SPACE / CLICK to continue", 100, 500, 14, "rgba(255,255,255,0.6)", "center", { font: FONT_B, weight: "800" });
}
function advanceCut() {
  const M = LEVEL_META[G.idx], cut = G.cut;
  if (cut.i >= M.lines.length) { beginPlay(); return; }
  const text = M.lines[cut.i][1];
  if (cut.chars < text.length) { cut.chars = text.length; return; }
  cut.i++; cut.chars = 0; SFX.play("click");
  if (cut.i < M.lines.length && M.lines[cut.i][0] === "pitts" && Math.random() < 0.6) SFX.play("chirp");
}

function drawResults() {
  const R = G.result, win = R.win;
  ctx.fillStyle = "rgba(15,10,30,0.66)"; ctx.fillRect(0, 0, W, H);
  panel(190, 70, 580, 400, win ? "rgba(255,250,235,0.98)" : "rgba(255,236,236,0.98)");
  if (win) {
    txt(G.idx === LAST_LEVEL ? "PITTS DEFEATED!" : "LEVEL COMPLETE!", W / 2, 118, 52, "#1f9e4a", "center", { stroke: INK, sw: 4 });
    txt(pick2(["School order restored... for now.", "Dr. Caliari: 1, Chaos: 0.", "That's going in the newsletter."], G.idx), W / 2, 160, 20, "#444", "center", { font: FONT_B, weight: "900" });
    drawStars(W / 2, 222, R.stars, 34, G.stateT);
    txt(`SCORE ${R.score}`, W / 2, 292, 40, INK);
    txt(R.newBest ? "★ NEW HIGH SCORE! ★" : `BEST ${save.hi[G.idx]}`, W / 2, 330, 22, R.newBest ? "#d63a2f" : "#666");
    drawCaliari(270, 440, 0.9, "cheer", G.t);
    drawPitts(690, 440, 0.9, "defeated", G.t);
    if (G.idx < LAST_LEVEL) button(W / 2 - 115, 360, 230, 54, "NEXT LEVEL ▶", () => startLevel(G.idx + 1), { color: "#7dffb0", size: 28 });
    else button(W / 2 - 115, 360, 230, 54, "EPILOGUE ▶", () => { setState("VICTORY_EPILOGUE"); SFX.play("fanfare"); }, { color: "#ffd21f", size: 28 });
    button(W / 2 - 115, 420, 110, 40, "REPLAY", () => startLevel(G.idx), { size: 20, color: "#cfe3ff" });
    button(W / 2 + 5, 420, 110, 40, "LEVELS", () => setState("LEVEL_SELECT"), { size: 20, color: "#cfe3ff" });
  } else {
    txt("GAME OVER", W / 2, 122, 62, "#d42a2a", "center", { stroke: INK, sw: 5 });
    const lines = wrap(R.reason, 500, 22);
    lines.forEach((l, k) => txt(l, W / 2, 172 + k * 28, 22, INK, "center", { font: FONT_B, weight: "900" }));
    txt(`SCORE ${R.score}`, W / 2, 262, 30, "#555");
    drawPitts(W / 2, 450, 0.85, "grin", G.t);
    bubbleStatic(W / 2 + 150, 380, pick2(PITTS_QUOTES, G.idx));
    button(W / 2 - 230, 400, 180, 54, "RETRY", () => startLevel(G.idx), { color: "#7dffb0", size: 28 });
    button(W / 2 + 50, 400, 180, 54, "LEVELS", () => setState("LEVEL_SELECT"), { color: "#cfe3ff", size: 28 });
  }
}
function pick2(arr, seed) { return arr[seed % arr.length]; }
function bubbleStatic(x, y, text) { drawBubble({ x, y, text, who: "pitts", t: 1, dur: 99 }); }

function drawEpilogue() {
  const t = G.stateT;
  // office
  ctx.fillStyle = "#e9dfc6"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#c9b48c"; ctx.fillRect(0, 380, W, 160);
  rr(60, 130, 200, 130, 6, "#bfe3ff", INK, 5); line(160, 130, 160, 260, INK, 4); line(60, 195, 260, 195, INK, 4); // window
  rr(300, 130, 200, 62, 8, "#7a4a22", INK, 4); txt("DR. CALIARI, Ed.D.", 400, 152, 22, "#ffe14d"); txt("ASSISTANT PRINCIPAL", 400, 176, 16, "#fff");
  rr(810, 120, 120, 90, 4, "#fff", INK, 3); txt("WORK ORDERS", 870, 142, 14, INK); txt("FILED: ALL", 870, 170, 18, "#1f9e4a"); txt("✓", 870, 196, 24, "#1f9e4a");
  // desk + Caliari, feet up
  const heroArt = spriteReady("caliari_hero");
  drawCaliari(330, heroArt ? 470 : 420, heroArt ? 2.3 : 1.6, heroArt ? "cheer" : "idle", t, { noLegs: true });
  rr(160, 380, 360, 40, 6, "#8a5a33", INK, 4); rr(180, 420, 320, 110, 4, "#7a4a22", INK, 4);
  if (!heroArt) {
    // feet on desk + espresso
    line(330, 360, 440, 368, "#3d4458", 16); ell(452, 362, 16, 9, "#2a1d16", INK, 3); ell(448, 376, 16, 9, "#2a1d16", INK, 3);
    ctx.save(); ctx.translate(372, 318); drawCoffee(0, 0, 0.9, true, t); ctx.restore();
  }
  // Pitts with golden broom + mop + work orders
  const px = 720;
  if (spriteReady("pitts_defeated")) drawPitts(px, 500, 2.2, "defeated", t);
  else {
    line(px - 52, 240, px - 30, 470, "#d59f1d", 6); poly([px - 44, 455, px - 16, 455, px - 6, 500, px - 54, 500], "#f6c445", INK, 3);
    line(px + 52, 250, px + 40, 470, "#a77b4a", 6); ell(px + 38, 480, 22, 10, "#ddd", INK, 3);
    drawPitts(px, 480, 1.6, "defeated", t);
    for (let i = 0; i < 6; i++) rr(px - 34, 400 - i * 7, 68, 8, 2, "#fff", INK, 1.5);
  }
  // banner
  const k = Math.min(1, t * 1.5);
  ctx.save(); ctx.translate(W / 2, 56); ctx.scale(k, k); ctx.rotate(-0.02);
  rr(-330, -44, 660, 88, 16, "#d63a2f", INK, 5);
  txt("SCHOOL ORDER: OFFICIALLY RESTORED!", 0, 2, 40, "#fff", "center", { stroke: INK, sw: 6 });
  ctx.restore();
  if (t > 1.2 && t < 1.25) burst(W / 2, 80, 80, ["#ffe14d", "#7dffb0", "#6bc6ff", "#ff6b9b", "#fff"], { shape: "paper", up: 300, max: 500 });
  if (Math.random() < 0.08) burst(rand(0, W), -10, 4, ["#ffe14d", "#7dffb0", "#6bc6ff", "#ff6b9b"], { shape: "paper", g: 120, min: 10, max: 60, life: 3 });
  if (t > 2) bubbleStatic(px - 10, 285, "Fine. I'll file the work orders. ALL of them.");
  if (t > 3.5) bubbleStatic(170, 380, "Five laps around the track, Pitts. After the mopping.");
  if (t > 5) {
    button(W / 2 - 120, 470, 240, 52, "PLAY AGAIN", () => setState("LEVEL_SELECT"), { color: "#7dffb0", size: 26 });
  }
  txt("Thanks for playing, Dr. C!", W / 2, 112, 24, INK);
}

function drawPause() {
  ctx.fillStyle = "rgba(15,10,30,0.7)"; ctx.fillRect(0, 0, W, H);
  panel(300, 130, 360, fsAvailable() ? 340 : 260);
  txt("PAUSED", W / 2, 190, 56, INK);
  txt("Coffee break.", W / 2, 232, 20, "#666", "center", { font: FONT_B, weight: "900" });
  button(W / 2 - 110, 260, 220, 54, "RESUME", () => { G.paused = false; }, { color: "#7dffb0" });
  if (fsAvailable()) button(W / 2 - 110, 410, 220, 40, isFullscreen() ? "EXIT FULL SCREEN" : "⛶ FULL SCREEN", toggleFullscreen, { size: 18, color: "#ffe39a" });
  button(W / 2 - 110, 326, 105, 44, "RETRY", () => startLevel(G.idx), { size: 20, color: "#cfe3ff" });
  button(W / 2 + 5, 326, 105, 44, "QUIT", () => setState("LEVEL_SELECT"), { size: 20, color: "#ffb3b3" });
}
/* =====================================================================
   MAIN LOOP
   ===================================================================== */
function update(dt) {
  G.t += dt; G.stateT += dt; G.invuln = Math.max(0, G.invuln - dt); G.confirmReset = Math.max(0, G.confirmReset - dt);
  updateFX(dt);
  checkOrientation();
  if (PORTRAIT && G.state === "GAMEPLAY") G.paused = true;
  const clicks = input.clicks; input.clicks = [];
  const free = [];
  for (const c of clicks) {
    const pad = c.touch ? 12 : 0;
    const b = [...hotButtons].reverse().find(b => inRect(c.x, c.y, { x: b.x - pad, y: b.y - pad, w: b.w + pad * 2, h: b.h + pad * 2 }));
    if (b) b.cb(); else free.push(c);
  }
  if (kp("m")) toggleMute();
  const go = kp("Enter", " ") || free.length > 0;
  switch (G.state) {
    case "INTRO_SPLASH": if (go) { SFX.play("whistle"); setState("LEVEL_SELECT"); } break;
    case "LEVEL_SELECT":
      for (let i = 1; i <= NUM_LEVELS; i++) if (kp(String(i)) && i <= save.unlocked) startLevel(i - 1);
      if (kp("Escape")) setState("INTRO_SPLASH");
      break;
    case "PRE_LEVEL_CUTSCENE": {
      const M = LEVEL_META[G.idx];
      if (G.cut.i < M.lines.length) G.cut.chars += dt * 55;
      if (G.stateT > 0.25 && go) advanceCut();
      if (kp("Escape")) beginPlay();
      break;
    }
    case "GAMEPLAY":
      if (G.paused) { if (kp("p", "Escape")) G.paused = false; break; }
      if (kp("p", "Escape")) { G.paused = true; break; }
      if (G.countdown > 0) {
        const before = Math.ceil(G.countdown - 0.2);
        G.countdown -= dt;
        const after = Math.ceil(G.countdown - 0.2);
        if (after !== before) SFX.play(after <= 0 ? "go" : "beep");
        break;
      }
      for (const c of free) G.level.click(c.x, c.y, c.touch);
      G.level.update(dt);
      break;
    case "LEVEL_COMPLETE":
      if (G.stateT > 0.8 && kp("Enter")) { if (G.idx < LAST_LEVEL) startLevel(G.idx + 1); else setState("VICTORY_EPILOGUE"); }
      break;
    case "GAME_OVER": if (G.stateT > 0.6 && kp("Enter")) startLevel(G.idx); break;
    case "VICTORY_EPILOGUE": if (G.stateT > 5 && kp("Enter")) setState("LEVEL_SELECT"); break;
  }
  input.pressed = {};
}

function draw() {
  buttons = [];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (FX.shake > 0) ctx.translate(rand(-FX.shake, FX.shake) * 0.5, rand(-FX.shake, FX.shake) * 0.5);
  switch (G.state) {
    case "INTRO_SPLASH": drawSplash(); break;
    case "LEVEL_SELECT": drawLevelSelect(); break;
    case "PRE_LEVEL_CUTSCENE": drawCutscene(); break;
    case "GAMEPLAY": case "LEVEL_COMPLETE": case "GAME_OVER":
      G.level.draw(); drawFX();
      break;
    case "VICTORY_EPILOGUE": drawEpilogue(); drawFX(); break;
  }
  ctx.restore();
  if (["GAMEPLAY", "LEVEL_COMPLETE", "GAME_OVER"].includes(G.state)) {
    drawHUD();
    if (G.state === "GAMEPLAY") {
      if (G.countdown > 0) {
        const n = Math.ceil(G.countdown - 0.2);
        const k = 1 + ((G.countdown - 0.2) % 1) * 0.6;
        ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(k, k);
        txt(n > 0 ? String(n) : "GO!", 0, 0, 120, n > 0 ? "#fff" : "#7dffb0", "center", { stroke: INK, sw: 14 });
        ctx.restore();
        txt(LEVEL_META[G.idx].goal, W / 2, H / 2 + 90, 24, "#ffe14d", "center", { stroke: INK });
      } else if (!G.paused) {
        if (G.level.overlayButtons) G.level.overlayButtons();
        if (G.level.usesJoystick && input.lastPointer !== "mouse") drawJoystick();
      }
      button(W - 92, 7, 42, 30, "II", () => { G.paused = !G.paused; }, { size: 18, color: "#fff" });
      if (G.paused) drawPause();
    } else drawResults();
  }
  if (FX.toast) {
    const f = FX.toast, a = clamp(Math.min(f.t * 5, (f.dur - f.t) * 3), 0, 1);
    ctx.globalAlpha = a;
    ctx.font = `900 20px ${FONT_B}`; const w = ctx.measureText(f.text).width + 40;
    rr(W / 2 - w / 2, 80, w, 40, 20, "rgba(23,17,43,0.92)", f.color, 3);
    txt(f.text, W / 2, 101, 20, f.color, "center", { font: FONT_B, weight: "900" });
    ctx.globalAlpha = 1;
  }
  muteButton();
  if ((G.state === "INTRO_SPLASH" || G.state === "LEVEL_SELECT") && fsAvailable()) fsButton(W - 92, 7);
  // cursor
  if (input.lastPointer === "mouse") {
    if (G.state === "GAMEPLAY" && G.idx === 0 && !G.paused && G.countdown <= 0) G.level.drawCursor();
    else if (G.state === "GAMEPLAY" && G.idx === LAST_LEVEL && !G.paused && G.countdown <= 0) {
      circ(input.mx, input.my, 12, null, "#fff", 3); line(input.mx - 18, input.my, input.mx + 18, input.my, "#fff", 2); line(input.mx, input.my - 18, input.mx, input.my + 18, "#fff", 2);
    } else {
      poly([input.mx, input.my, input.mx + 4, input.my + 22, input.mx + 9, input.my + 15, input.mx + 17, input.my + 15], "#fff", INK, 2.5);
    }
  }
  hotButtons = buttons;
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  try { update(dt); draw(); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
window.addEventListener("blur", () => { if (G.state === "GAMEPLAY") G.paused = true; });
document.addEventListener("visibilitychange", () => { if (document.hidden && G.state === "GAMEPLAY") G.paused = true; });
canvas.focus();
requestAnimationFrame(frame);
// test hook
window.__WAP = { G, save, startLevel, beginPlay, input, LEVEL_CLASSES, setState, winLevel };
</script>
